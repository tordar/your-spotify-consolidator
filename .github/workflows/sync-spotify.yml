# Spotify Data Sync – runs on schedule and workflow_dispatch
name: Spotify Data Sync

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  sync-spotify-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # so the workflow can push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Pull latest changes
        run: |
          git fetch origin master
          git pull --rebase origin master || git pull --no-edit origin master || echo "No remote changes to pull"
        
      - name: Fetch recent Spotify plays
        id: fetch-plays
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run fetch-recent-plays

      - name: Merge recent data with merged streaming history
        if: steps.fetch-plays.outcome == 'success'
        run: npm run merge-recent-data
        
      - name: Generate cleaned and consolidated data files
        if: steps.fetch-plays.outcome == 'success'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run generate-cleaned-files
        
      - name: Add podcast data to stats
        if: steps.fetch-plays.outcome == 'success'
        run: npm run add-podcast-data
        
      - name: Pull latest changes
        if: steps.fetch-plays.outcome == 'success'
        run: |
          git fetch origin master
          git pull --rebase origin master || git pull --no-edit origin master || echo "No remote changes to pull"
          
      - name: Commit changes
        if: steps.fetch-plays.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Require at least one merged file so we never commit deletion-only (gitignore would skip new file without -f)
          MERGED_COUNT=$(ls -1 data/merged-streaming-history/merged-streaming-history-*.json 2>/dev/null | wc -l)
          if [ "$MERGED_COUNT" -eq 0 ]; then
            echo "::error::No merged-streaming-history file found after merge; skipping commit to avoid deleting data"
            exit 1
          fi
          git add -f data/merged-streaming-history/ data/cleaned-data/
          git diff --staged --quiet || git commit -m "Spotify sync $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
      - name: Push changes
        if: steps.fetch-plays.outcome == 'success'
        run: |
          git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git master
